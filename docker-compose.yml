version: '3.8'

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql1
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./init:/container-init # Added to mount your init-db.sh script into the container
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Moved inside the 'sql' block with correct indentation
    entrypoint: >
      bash -c "
      /container-init/init-db.sh &
      /opt/mssql/bin/sqlservr
      "

  app:
    build: .
    container_name: db-tool-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      sql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
